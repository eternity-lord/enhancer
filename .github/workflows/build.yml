name: Android CI Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Enhancer v3.0 Universal Debug APK (arm64-v8a / armeabi-v7a / x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache neural weights & multi-ABI ncnn SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/enhancer-build-deps
          key: enhancer-deps-v3-ncnn20261020-cf-cfe0fe2d

      - name: Prepare CodeFormer weights & multi-ABI ncnn
        run: |
          chmod +x ./scripts/prepare_build_deps.sh
          ./scripts/prepare_build_deps.sh

      - name: Ensure Android SDK Platform 34, Build-Tools, CMake, and pinned NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;30.0.16248370"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Universal Debug APK
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log; then
            grep -E "e: |error:|FAILURE:|What went wrong|> " gradle_build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Verify packaged neural models & ABIs in Enhancer-v3.0-debug.apk
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          TARGET_APK="$APK_DIR/Enhancer-v3.0-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            FOUND_APK="$(find "$APK_DIR" -maxdepth 2 -name '*-debug.apk' | head -n 1)"
            if [ -z "$FOUND_APK" ]; then
              echo "::error::No debug APK found under $APK_DIR"
              exit 1
            fi
            cp -f "$FOUND_APK" "$TARGET_APK"
          fi
          ls -lh "$TARGET_APK"
          APK_LIST="$(unzip -l "$TARGET_APK")"
          echo "$APK_LIST" | grep -E "lib/.*/libenhancer\.so|assets/models/(codeformer|scrfd|realesr|lsdir)"
          for req in \
            "lib/arm64-v8a/libenhancer.so" \
            "lib/armeabi-v7a/libenhancer.so" \
            "lib/x86_64/libenhancer.so" \
            "assets/models/codeformer_encoder.bin" \
            "assets/models/codeformer_generator.bin" \
            "assets/models/scrfd_2.5g_kps.bin" \
            "assets/models/realesrgan-x4plus.bin" \
            "assets/models/realesr-general-x4v3.bin" \
            "assets/models/realesr-general-wdn-x4v3.bin" \
            "assets/models/lsdir-compact-x4.bin"; do
            if ! echo "$APK_LIST" | grep -Fq "$req"; then
              echo "::error::Missing required APK entry: $req"
              exit 1
            fi
          done

      - name: Upload Enhancer-v3.0-debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: Enhancer-v3.0-debug
          path: app/build/outputs/apk/debug/Enhancer-v3.0-debug.apk
          if-no-files-found: error

      - name: Attach Universal Android APK to GitHub Release v3.0.0 (on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v3.0.0"
          APK="app/build/outputs/apk/debug/Enhancer-v3.0-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Enhancer v3.0 Studio (Windows x64 & Android)" \
              --notes "Enhancer v3.0 Studio — Built by Mohammad Irani (100% Offline AI Super-Resolution, Face Restoration & Smart HDR for Windows x64 & Android)."
          fi
