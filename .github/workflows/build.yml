name: Android CI Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Enhancer v2.0 Debug APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure Android SDK Platform 34, Build-Tools, CMake, and pinned NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;30.0.16248370"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_build.log; then
            grep -E "e: |error:|FAILURE:|What went wrong|> " gradle_build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Prepare Enhancer-v2.0-debug.apk
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          TARGET_APK="$APK_DIR/Enhancer-v2.0-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            FOUND_APK="$(find "$APK_DIR" -maxdepth 2 -name '*-debug.apk' | head -n 1)"
            if [ -z "$FOUND_APK" ]; then
              echo "::error::No debug APK found under $APK_DIR"
              exit 1
            fi
            mv "$FOUND_APK" "$TARGET_APK"
          fi
          ls -lh "$TARGET_APK"

      - name: Upload Enhancer-v2.0-debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: Enhancer-v2.0-debug
          path: app/build/outputs/apk/debug/Enhancer-v2.0-debug.apk
          if-no-files-found: error
